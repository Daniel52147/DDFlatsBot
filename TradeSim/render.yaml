# TradeSim на Render — 24/7 дашборд + боты
# Dashboard → New → Blueprint → подключи репозиторий DDFlatsBot
# Или создай Web Service вручную по RENDER.md

services:
  - type: web
    name: tradesim
    runtime: docker
    rootDir: TradeSim
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: TRADESIM_BIND_HOST
        value: "0.0.0.0"
      - key: DATA_DIR
        value: /var/data
      - key: TRADING_MODE_DEFAULT
        value: paper
      - key: AUTO_APPLY_TRADING_MODE_ON_START
        value: "false"
      - key: EXCHANGE_ENABLED
        value: "false"
      - key: EXCHANGE_TESTNET
        value: "true"
      - key: PAPER_LEARN_ENABLED
        value: "true"
      - key: PYTHONUNBUFFERED
        value: "1"
      # Секреты задай в Dashboard → Environment:
      # TRADESIM_API_TOKEN (обязательно)
      # TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID (опционально)
    disk:
      name: tradesim-data
      mountPath: /var/data
      sizeGB: 1
