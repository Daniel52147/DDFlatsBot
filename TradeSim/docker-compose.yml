services:
  tradesim:
    build: .
    ports:
      - "8765:8765"
    volumes:
      - tradesim-data:/app/data
    environment:
      - TRADESIM_BIND_HOST=0.0.0.0
      # - TRADESIM_API_TOKEN=change-me
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  tradesim-data:
