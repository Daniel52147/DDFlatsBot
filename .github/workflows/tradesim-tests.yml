name: TradeSim Tests

on:
  push:
    branches: [main, cursor/**]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: TradeSim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest-cov
      - run: python3 -m pytest tests/ -v --cov=simulator --cov=learning --cov=security --cov-report=term-missing
      - run: python3 -m py_compile main.py simulator/*.py learning/*.py assistant/*.py exchange/*.py
